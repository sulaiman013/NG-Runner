[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ngrunner"
version = "0.0.1"
description = "NG Runner: runs Jim's IC summary to Mozaik pipeline automatically on his Windows PC"
requires-python = ">=3.13"
dependencies = [
    # Pinned exactly: content fingerprints hash pypdf's text extraction, so another version can
    # change them. Upgrade on purpose only, and recompute every stored fingerprint after it.
    "pypdf==6.21.4",
    # P1a: board, tray, toasts, Windows APIs, HTTP, backups, and Pacific time (Windows has no
    # IANA time-zone data of its own, so zoneinfo needs tzdata). Pinned so the packaged build
    # is the one the tests ran on.
    "flask==3.1.3",
    "waitress==3.0.2",
    "requests==2.34.2",
    "pystray==0.19.5",
    "pillow==13.0.0",
    "psutil==7.2.2",
    "pywin32==312",
    "windows-toasts==1.3.1",
    "cryptography==50.0.2",
    "tzdata==2026.6",
    # Signs in to Studio through the community site, which needs a real browser. It drives the
    # Edge that Windows already has, so no browser ships with NG Runner.
    "playwright==1.60.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
include = ["ngrunner*"]          # the app only: tests, tools, docs and installer stay out

[tool.setuptools.package-data]
ngrunner = ["board/templates/*", "board/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # the repo root, so the tests import ngrunner from any folder
addopts = "-ra"
markers = [
    "fixtures: needs local-only material (real IC summaries, NG Jobs on G:, Jim's spec); skipped when absent",
]
# Bites only when Python runs with -X warn_default_encoding (AGENTS.md: Commands), so
# tests/conftest.py refuses to start a run without it: no run is ever quietly green.
filterwarnings = ["error::EncodingWarning"]
